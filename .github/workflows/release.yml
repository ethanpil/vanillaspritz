name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set extension version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' dist/extension/manifest.json > manifest.tmp
          mv manifest.tmp dist/extension/manifest.json

      - name: Zip Chrome extension
        run: |
          cd dist/extension
          zip -r ../rsvp-reader-extension.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rsvp-reader-extension.zip
            dist/bookmarklet.txt
            dist/rsvp-reader.min.js
          generate_release_notes: true
